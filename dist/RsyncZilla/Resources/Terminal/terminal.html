<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RsyncZilla Terminal</title>
  <link rel="stylesheet" href="xterm.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #12151A;
    }
    #terminal-container {
      width: 100%;
      height: 100%;
      padding: 4px;
    }
    .xterm {
      height: 100%;
    }
    .xterm-viewport {
      overflow-y: auto !important;
    }
  </style>
</head>
<body>
  <div id="terminal-container"></div>

  <script src="xterm.js"></script>
  <script src="xterm-addon-fit.js"></script>
  <script>
    const term = new Terminal({
      cursorBlink: true,
      cursorStyle: 'bar',
      fontSize: 13,
      fontFamily: "'Cascadia Code', 'Fira Code', 'Consolas', 'Courier New', monospace",
      theme: {
        background: '#12151A',
        foreground: '#D8DEE9',
        cursor: '#38BDF8',
        cursorAccent: '#12151A',
        selectionBackground: 'rgba(56, 189, 248, 0.35)',
        selectionInactiveBackground: 'rgba(56, 189, 248, 0.2)',
        black: '#1E232A',
        red: '#EF4444',
        green: '#10B981',
        yellow: '#F59E0B',
        blue: '#3B82F6',
        magenta: '#EC4899',
        cyan: '#06B6D4',
        white: '#E2E8F0',
        brightBlack: '#475569',
        brightRed: '#F87171',
        brightGreen: '#34D399',
        brightYellow: '#FBBF24',
        brightBlue: '#60A5FA',
        brightMagenta: '#F472B6',
        brightCyan: '#22D3EE',
        brightWhite: '#F8FAFC'
      },
      scrollback: 5000,
      allowProposedApi: true
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);

    // Intercept DECSET mouse modes so vi / vim / htop don't disable mouse text selection
    const mouseTrackingModes = new Set([9, 1000, 1001, 1002, 1003, 1005, 1006, 1015, 1016]);
    term.parser.registerCsiHandler({ prefix: '?', final: 'h' }, params => {
      for (let i = 0; i < params.length; i++) {
        if (mouseTrackingModes.has(params[i])) {
          return true; // Intercept and suppress mouse tracking to keep native text selection enabled
        }
      }
      return false;
    });

    term.parser.registerCsiHandler({ prefix: '?', final: 'l' }, params => {
      for (let i = 0; i < params.length; i++) {
        if (mouseTrackingModes.has(params[i])) {
          return true;
        }
      }
      return false;
    });

    // OSC 7 handler for current directory reporting
    term.parser.registerOscHandler(7, data => {
      try {
        let path = data;
        if (path.startsWith('file://')) {
          const url = new URL(path);
          path = decodeURIComponent(url.pathname);
        }
        if (path && window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage({
            type: 'dir_changed',
            path: path
          });
        }
      } catch (err) {}
      return true;
    });

    // Window title handler as fallback for directory tracking
    term.onTitleChange(title => {
      try {
        if (!title) return;
        let path = title;
        const colonIdx = path.lastIndexOf(':');
        if (colonIdx !== -1) {
          path = path.substring(colonIdx + 1).trim();
        }
        if (path.startsWith('/') || path.startsWith('~')) {
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage({
              type: 'dir_changed',
              path: path
            });
          }
        }
      } catch (err) {}
    });

    const container = document.getElementById('terminal-container');
    term.open(container);

    function getSafeDimensions() {
      const c = term.cols && term.cols > 0 ? term.cols : 80;
      const r = term.rows && term.rows > 0 ? term.rows : 24;
      return {
        cols: Math.max(c, 20),
        rows: Math.max(r, 5)
      };
    }

    function reportResize() {
      try {
        fitAddon.fit();
        const dims = getSafeDimensions();
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage({
            type: 'resize',
            cols: dims.cols,
            rows: dims.rows
          });
        }
      } catch (err) {}
    }

    // Auto-fit on window resize
    window.addEventListener('resize', () => {
      reportResize();
    });

    // Send user input to C#
    term.onData(data => {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({
          type: 'input',
          data: data
        });
      }
    });

    // Handle messages from C#
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener('message', event => {
        const msg = event.data;
        if (typeof msg === 'string') {
          term.write(msg);
        } else if (msg && msg.type === 'data') {
          term.write(msg.data);
        } else if (msg && msg.type === 'clear') {
          term.clear();
        } else if (msg && msg.type === 'fit') {
          reportResize();
        } else if (msg && msg.type === 'copy') {
          if (term.hasSelection()) {
            const selected = term.getSelection();
            window.chrome.webview.postMessage({
              type: 'copy_selection',
              text: selected
            });
          }
        }
      });
    }

    // Quick copy / paste with mouse right-click
    container.addEventListener('contextmenu', e => {
      e.preventDefault();
      if (term.hasSelection()) {
        const selected = term.getSelection();
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage({
            type: 'copy_selection',
            text: selected
          });
        }
        try { navigator.clipboard.writeText(selected); } catch (err) {}
        term.clearSelection();
      } else {
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage({
            type: 'request_paste'
          });
        }
      }
    });

    // Keyboard shortcuts (Ctrl+C when selected, Ctrl+Shift+C / Ctrl+Shift+V)
    window.addEventListener('keydown', e => {
      if (e.ctrlKey && !e.shiftKey && (e.key === 'c' || e.key === 'C')) {
        if (term.hasSelection()) {
          const selected = term.getSelection();
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage({
              type: 'copy_selection',
              text: selected
            });
          }
          try { navigator.clipboard.writeText(selected); } catch (err) {}
          e.preventDefault();
          return;
        }
      } else if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) {
        if (term.hasSelection()) {
          const selected = term.getSelection();
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage({
              type: 'copy_selection',
              text: selected
            });
          }
          try { navigator.clipboard.writeText(selected); } catch (err) {}
        }
        e.preventDefault();
      } else if ((e.ctrlKey && e.shiftKey && (e.key === 'V' || e.key === 'v')) ||
                 (e.ctrlKey && !e.shiftKey && (e.key === 'v' || e.key === 'V') && e.target === document.body)) {
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage({
            type: 'request_paste'
          });
        }
        e.preventDefault();
      }
    });

    // Initial fit once DOM is ready
    setTimeout(() => {
      reportResize();
      term.focus();
      const dims = getSafeDimensions();
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({
          type: 'ready',
          cols: dims.cols,
          rows: dims.rows
        });
      }
    }, 100);
  </script>
</body>
</html>
